[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-stall-monitor"
version = "0.1.0"
description = "Find stalled interview-scheduling threads, track adoption, and write a weekly value report."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyyaml"]

[tool.setuptools]
packages = ["stallmon"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
